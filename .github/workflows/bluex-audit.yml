name: BLUEX On-chain Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bluex-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      JETTON_MASTER: EQCUcgi1T0zSOvRIIM4ucj83GI2xqTxrLhaAlwaH8tOw9oTJ
      CLEAN_IMAGE: https://raw.githubusercontent.com/hazhanhasani/BULECOIN-GRAM/main/bluecoin-logo.png
    steps:
      - name: Query TON APIs and contract capabilities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit

          curl --fail --silent --show-error --retry 3 \
            "https://toncenter.com/api/v2/getTokenData?address=${JETTON_MASTER}" \
            -o audit/toncenter.json

          if curl --fail --silent --show-error --retry 2 \
            "https://tonapi.io/v2/jettons/${JETTON_MASTER}" \
            -o audit/tonapi.json; then
            echo 'TONAPI query: OK'
          else
            echo '::warning::TONAPI is temporarily unavailable for this asset; continuing with TON Center.'
            printf '{}\n' > audit/tonapi.json
          fi

          curl --fail --silent --show-error --retry 3 \
            -X POST "https://toncenter.com/api/v3/runGetMethod" \
            -H 'Content-Type: application/json' \
            -d "{\"address\":\"${JETTON_MASTER}\",\"method\":\"get_next_admin_address\",\"stack\":[]}" \
            -o audit/next-admin.json

      - name: Validate BLUEX identity supply and current control state
        shell: bash
        run: |
          set -euo pipefail
          echo '=== TONCENTER ==='
          jq '.result | {address,total_supply,mintable,admin_address,jetton_content}' audit/toncenter.json
          echo '=== TONAPI (best effort) ==='
          jq '{mintable,total_supply,holders_count,verification,metadata}' audit/tonapi.json
          echo '=== CONTRACT CAPABILITY: get_next_admin_address ==='
          jq '{exit_code,stack}' audit/next-admin.json

          NAME=$(jq -r '.result.jetton_content.data.name // empty' audit/toncenter.json)
          SYMBOL=$(jq -r '.result.jetton_content.data.symbol // empty' audit/toncenter.json)
          DECIMALS=$(jq -r '.result.jetton_content.data.decimals // empty' audit/toncenter.json)
          SUPPLY=$(jq -r '.result.total_supply // empty' audit/toncenter.json)
          IMAGE=$(jq -r '.result.jetton_content.data.image // empty' audit/toncenter.json)
          ADMIN=$(jq -r '.result.admin_address // empty' audit/toncenter.json)
          NEXT_ADMIN_EXIT=$(jq -r '.exit_code // -1' audit/next-admin.json)

          test "$NAME" = "BlueCoin"
          test "$SYMBOL" = "BLUEX"
          test "$DECIMALS" = "9"
          test "$SUPPLY" = "100000000000000000"
          test "$NEXT_ADMIN_EXIT" = "0"

          echo "Current admin: ${ADMIN:-<none>}"
          if [ -z "$ADMIN" ] || [ "$ADMIN" = "null" ]; then
            echo 'Ownership state: REVOKED / NO ADMIN'
          else
            echo 'Ownership state: ADMIN PRESENT'
          fi

          if [ "$IMAGE" = "$CLEAN_IMAGE" ]; then
            echo 'Metadata image URL: CLEAN'
          else
            echo "::warning::Metadata image URL differs from final value: ${IMAGE}"
          fi

          # For this contract family the API mintable flag may remain true even after
          # admin rights are removed. The irreversible lock criterion is no privileged admin.

      - name: Upload raw public audit data
        uses: actions/upload-artifact@v4
        with:
          name: bluex-onchain-audit
          path: audit/*.json
          retention-days: 7
