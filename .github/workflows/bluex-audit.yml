name: BLUEX On-chain Audit

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bluex-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      JETTON_MASTER: EQCUcgi1T0zSOvRIIM4ucj83GI2xqTxrLhaAlwaH8tOw9oTJ
    steps:
      - name: Query BLUEX contract directly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit

          curl --fail --silent --show-error --retry 3 \
            -X POST "https://toncenter.com/api/v3/runGetMethod" \
            -H 'Content-Type: application/json' \
            -d "{\"address\":\"${JETTON_MASTER}\",\"method\":\"get_jetton_data\",\"stack\":[]}" \
            -o audit/get-jetton-data.json

          curl --fail --silent --show-error --retry 3 \
            -X POST "https://toncenter.com/api/v3/runGetMethod" \
            -H 'Content-Type: application/json' \
            -d "{\"address\":\"${JETTON_MASTER}\",\"method\":\"get_next_admin_address\",\"stack\":[]}" \
            -o audit/next-admin.json

          # Indexer APIs are best effort after ownership revocation; they may briefly return 409.
          if curl --fail --silent --show-error --retry 1 \
            "https://tonapi.io/v2/jettons/${JETTON_MASTER}" \
            -o audit/tonapi.json; then
            echo 'TONAPI query: OK'
          else
            printf '{}\n' > audit/tonapi.json
            echo '::warning::TONAPI indexer not ready yet.'
          fi

          if curl --fail --silent --show-error --retry 1 \
            "https://toncenter.com/api/v2/getTokenData?address=${JETTON_MASTER}" \
            -o audit/toncenter-token-data.json; then
            echo 'TON Center token indexer: OK'
          else
            printf '{}\n' > audit/toncenter-token-data.json
            echo '::warning::TON Center token indexer not ready yet.'
          fi

      - name: Print and validate direct contract state
        shell: bash
        run: |
          set -euo pipefail
          echo '=== get_jetton_data ==='
          jq . audit/get-jetton-data.json
          echo '=== get_next_admin_address ==='
          jq . audit/next-admin.json
          echo '=== TONAPI best effort ==='
          jq '{mintable,total_supply,holders_count,verification,metadata}' audit/tonapi.json
          echo '=== TON Center token-data best effort ==='
          jq '.result | {address,total_supply,mintable,admin_address,jetton_content}' audit/toncenter-token-data.json

          test "$(jq -r '.exit_code // -1' audit/get-jetton-data.json)" = "0"
          test "$(jq -r '.exit_code // -1' audit/next-admin.json)" = "0"

      - name: Upload raw public audit data
        uses: actions/upload-artifact@v4
        with:
          name: bluex-onchain-audit
          path: audit/*.json
          retention-days: 7
