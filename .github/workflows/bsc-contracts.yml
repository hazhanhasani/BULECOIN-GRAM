name: BLUEX BSC Contract Tests

on:
  push:
    branches: [main, "feat/bluex-bsc-testnet-foundation"]
    paths: ["contracts/bsc/**", "foundry.toml", ".github/workflows/bsc-contracts.yml"]
  pull_request:
    paths: ["contracts/bsc/**", "foundry.toml", ".github/workflows/bsc-contracts.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  solidity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: Install pinned dependencies
        run: |
          forge install --no-git OpenZeppelin/openzeppelin-contracts@v5.4.0
          forge install --no-git foundry-rs/forge-std@v1.9.7
      - name: Compile
        run: forge build --sizes
      - name: Test
        run: forge test -vvv
