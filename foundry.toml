[profile.default]
src = "contracts/bsc/src"
test = "contracts/bsc/test"
script = "contracts/bsc/script"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "paris"
optimizer = true
optimizer_runs = 200
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/"
]
